name: "Test"
permissions: "read-all"
on:
  - "push"
  - "pull_request"

jobs:
  build:
    name: "Build suite (with Haxe ${{ matrix.haxe-version }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        haxe-version:
          - "4.2.0"
          - "4.3.6"
          - "latest"
    steps:
      - name: "Install Haxe"
        uses: "krdlab/setup-haxe@v1"
        with:
          haxe-version: "${{ matrix.haxe-version }}"
      - name: "Get Haxelib local repository path"
        id: "haxelib-get-path"
        shell: "bash"
        run: |
          echo "dir=$(haxelib config)" >> $GITHUB_OUTPUT
      - name: "Checkout"
        uses: "actions/checkout@v4"
        with:
          lfs: false
      - name: "Restore cached Haxe dependencies"
        id: "restore-cache"
        uses: "actions/cache/restore@v4"
        with:
          path: "${{ steps.haxelib-get-path.outputs.dir }}"
          key: "haxelib-repo-${{ matrix.haxe-version }}-${{ hashFiles('tests/buildTests.hxml') }}"
          restore-keys: |
            haxelib-repo-${{ matrix.haxe-version }}-
            haxelib-repo-
      - name: "Install Haxe dependencies"
        if: steps.restore-cache.outputs.cache-hit != 'true'
        shell: "bash"
        run: "haxelib install tests/buildTests.hxml --always --quiet"
      - name: "Cache Haxe dependencies"
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: "actions/cache/save@v4"
        with:
          path: "${{ steps.haxelib-get-path.outputs.dir }}"
          key: "haxelib-repo-${{ matrix.haxe-version }}-${{ hashFiles('tests/buildTests.hxml') }}"
      - name: "Build tests"
        working-directory: "tests"
        shell: "bash"
        run: "haxe buildTests.hxml"
      - name: "Upload built suites"
        uses: "actions/upload-artifact@v4"
        with:
          name: "suites-${{ matrix.haxe-version }}"
          path: "tests/out/"
          retention-days: 1

  hashlink:
    name: "Hashlink (${{ matrix.hl-version }}, Windows)"
    runs-on: "windows-latest"
    strategy:
      fail-fast: false
      matrix:
        hl-version:
          - "1.15.0"
    needs:
      - "build"
    steps:
      - name: "Install Hashlink"
        uses: "cedx/setup-hashlink@v6"
        with:
          version: "${{ matrix.hl-version }}"
      - name: "Download test suites"
        uses: "actions/download-artifact@v4"
        with:
          name: "suites-4.3.6"
      - name: "Run test suite"
        shell: "bash"
        run: "hl hashlink/suite.hl"
      - name: "Save coverage stats as an artifact"
        uses: "actions/upload-artifact@v4"
        with:
          name: "coverage-hashlink"
          path: "lcov.info"
          if-no-files-found: "error"
          retention-days: 1

  coverage:
    name: "Process code coverage results"
    runs-on: "ubuntu-latest"
    needs:
      - "hashlink"
    steps:
      - name: "Checkout (for additional metadata)"
        uses: "actions/checkout@v4"
      - name: "Download coverage stats from an artifact"
        uses: "actions/download-artifact@v4"
        with:
          name: "coverage-hashlink"
      - name: "Upload code coverage report to Codecov"
        uses: "codecov/codecov-action@v5"
        with:
          token: "${{ secrets.CODECOV_TOKEN }}"
          files: "lcov.info"
          fail_ci_if_error: true
