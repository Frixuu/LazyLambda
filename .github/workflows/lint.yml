name: "Lint"
on:
  - "push"
  - "pull_request"

jobs:
  formatting:
    name: "Formatting"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"
      - name: "Install Haxe"
        uses: "krdlab/setup-haxe@v1"
        with:
          haxe-version: "4.3.6"
      - name: "Install tools"
        run: "haxelib --global install formatter --quiet"
      - name: "Run formatter"
        run: "haxelib --global run formatter --check --source src"

  checkstyle:
    name: "Static analysis"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"
      - name: "Install Haxe"
        uses: "krdlab/setup-haxe@v1"
        with:
          haxe-version: "4.3.6"
      - name: "Install tools"
        run: "haxelib --global install checkstyle --quiet"
      - name: "Run Checkstyle"
        run: "haxelib --global run checkstyle --show-parser-errors --exitcode --source src"
